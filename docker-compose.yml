services:
  frontend:
    build:
      context: .
      # single image that builds the app and serves it via nginx
    image: expence-tracker-frontend:latest
    ports:
      - '3000:80' # host:container -> access app at http://localhost:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
